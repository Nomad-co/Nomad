name: Nomad smoke monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check staging
        env:
          NOMAD_ORIGIN: https://nomad-core-staging.nomad-mcp-feasibility.workers.dev
          EXPECTED_ENVIRONMENT: staging
        run: node apps/nomad-worker/scripts/smoke.mjs
      - name: Check production
        env:
          NOMAD_ORIGIN: https://nomad-core.nomad-mcp-feasibility.workers.dev
          EXPECTED_ENVIRONMENT: production
        run: node apps/nomad-worker/scripts/smoke.mjs
