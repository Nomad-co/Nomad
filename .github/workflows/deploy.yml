name: Deploy Nomad

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: nomad-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    defaults:
      run:
        working-directory: apps/nomad-worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/nomad-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck && pnpm test
      - name: Apply staging migrations
        if: inputs.target == 'staging'
        run: pnpm exec wrangler d1 migrations apply nomad-core-staging --env staging --remote
      - name: Deploy staging
        if: inputs.target == 'staging'
        run: pnpm exec wrangler deploy --env staging
      - name: Apply production migrations
        if: inputs.target == 'production'
        run: pnpm exec wrangler d1 migrations apply nomad-core --remote
      - name: Deploy production
        if: inputs.target == 'production'
        run: pnpm exec wrangler deploy
      - name: Verify deployment
        env:
          NOMAD_ORIGIN: ${{ vars.NOMAD_ORIGIN }}
          EXPECTED_ENVIRONMENT: ${{ inputs.target }}
        run: node scripts/smoke.mjs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
